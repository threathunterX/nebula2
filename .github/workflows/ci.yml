name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: 凭据扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 直接用 CLI 而不是 gitleaks-action:action 在扫描进程崩溃后仍会去上传
      # results.sarif,于是日志末尾是「File results.sarif does not exist」——
      # 真正的原因(配置里的正则 RE2 编译失败)被埋在几十行 Go 栈里,看起来
      # 像是 action 自身的环境问题。
      - name: 安装 gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: 扫描提交历史
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - name: 扫描工作区
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-git
      - name: 断言本机凭据文件未进版本库
        run: make check-env-untracked

  schema:
    name: 领域模型与资产校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装校验依赖
        run: pip install -r tools/requirements.txt
      - name: 校验 schema 自身合法
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          ok = True
          for p in pathlib.Path('packages/domain-schema').glob('*.schema.json'):
              try:
                  Draft202012Validator.check_schema(json.loads(p.read_text(encoding='utf-8')))
                  print(f'  ok  {p}')
              except Exception as e:
                  print(f'  ERR {p}: {e}'); ok = False
          sys.exit(0 if ok else 1)
          PY
      - name: 校验 seeds 资产符合 schema
        run: python tools/validate_seeds.py

  privacy:
    name: 隐私合规检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 检查是否混入真实个人信息或客户标识
        run: python tools/check_no_pii.py

  docs:
    name: 文档与资产一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 校验自动生成的参考文档与 seeds 一致
        run: |
          python tools/gen_variable_reference.py --check
          python tools/gen_strategy_reference.py --check
          python tools/gen_seeds_index.py --check
      - name: 校验文档内部链接可达
        run: python tools/check_doc_links.py

  reference-engine:
    name: 参考引擎规格符合性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 规格符合性测试
        run: cd packages/reference-engine && node --test 'test/*.test.js'
      - name: 场景冒烟(全部策略可完成求值)
        run: cd packages/reference-engine && node run.js

  collector:
    name: 采集器(Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: 编译
        run: go build ./...
      - name: 静态检查
        run: go vet ./...
      - name: 格式检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi
      - name: 测试
        run: go test -cover ./...

  engine:
    name: 引擎算子层(Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 编译与测试(含共享向量对照)
        run: mvn -B verify

  console:
    name: 控制面(Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 授权矩阵是那种改一行就静默放宽的东西:给 /api/v2/** 加一条 permitAll
      # 不会有任何报错,只会让管理接口变成匿名可写。必须每次都跑。
      - name: 编译与测试(认证与授权矩阵)
        run: mvn -B verify

  tools:
    name: 校验工具自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # 隐私检查器是 CI 门禁,它自己出错没有别的东西会发现。门禁静默失效比没有
      # 门禁更糟 —— 它让人相信已经检查过了。发布前复审时就在这个脚本里发现了一处
      # 可绕过:邮箱白名单用子串匹配,把允许域名嵌进自己的域名里就能放行。
      - name: 工具自测
        run: python3 -m unittest discover -s tools/test -v

  web:
    name: 管理界面(TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/console-web/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 构建
        run: npm run build

  diagrams:
    name: 文档图渲染
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # GitHub 原生渲染 Mermaid,但语法错误不会以任何方式告诉作者 —— 页面上只是
      # 一块红色错误区,而写文档的人通常不会再回去看渲染结果。这里真正编译一遍。
      - name: 安装 mermaid-cli
        run: npm i -g @mermaid-js/mermaid-cli
      - name: 渲染校验
        run: python3 tools/check_mermaid.py

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 这一栏存在的理由:容器化时一次撞出四个只在部署阶段才暴露的问题
      # (class 文件版本、连接器未打包、卷属主、建表脚本依赖 docker 命令)。
      # 单元测试全绿、本地 java -jar 也正常,唯独提交到集群才炸 —— 不构建
      # 镜像就等于把这类问题留给部署当天。
      - name: 采集器镜像
        run: docker build -t nebula-collector:ci apps/collector
      - name: 控制面镜像
        run: docker build -f apps/console-api/Dockerfile -t nebula-console-api:ci .
      - name: 引擎镜像
        run: docker build -f apps/engine/Dockerfile -t nebula-engine:ci .
      - name: 建表镜像
        run: docker build -t nebula-schema-init:ci deploy/schema

      # 构建成功不代表能用。这几条断言针对的正是上面那四个问题。
      # jar 取到宿主机上检查:Flink 镜像里没有 unzip,在容器内验证反而更麻烦。
      - name: 取出作业 jar
        run: |
          cid=$(docker create nebula-engine:ci)
          docker cp "$cid":/opt/flink/usrlib/nebula-engine.jar /tmp/nebula-engine.jar
          docker rm "$cid" > /dev/null

      - name: 作业 jar 必须是 Java 17 字节码
        run: |
          unzip -p /tmp/nebula-engine.jar \
            cn/threathunter/nebula/engine/flink/NebulaJob.class > /tmp/NebulaJob.class
          # awk 只取第一行:od 末尾还会输出一行偏移量,不加 NR==1 会得到 "61\n0"
          v=$(od -An -tu1 -j6 -N2 /tmp/NebulaJob.class | awk 'NR==1 {print $1*256+$2; exit}')
          echo "class 文件版本: $v (61 = Java 17)"
          test "$v" -eq 61

      - name: 作业 jar 必须自带连接器与 Jackson
        run: |
          unzip -l /tmp/nebula-engine.jar > /tmp/jar.txt
          grep -q 'org/apache/flink/connector/kafka/source/KafkaSource.class' /tmp/jar.txt
          grep -q 'com/fasterxml/jackson/core/type/TypeReference.class' /tmp/jar.txt

      - name: checkpoint 目录必须归 flink 所有
        run: |
          owner=$(docker run --rm nebula-engine:ci stat -c '%U' /flink-checkpoints)
          echo "属主: $owner"
          test "$owner" = flink

      - name: 采集器镜像里不应有 shell
        run: |
          if docker run --rm --entrypoint /bin/sh nebula-collector:ci -c 'echo x' 2>/dev/null; then
            echo "distroless 镜像里不该存在 shell"; exit 1
          fi
          docker run --rm nebula-collector:ci --help > /dev/null
