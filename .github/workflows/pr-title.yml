name: PR 标题规范

# PR 标题会成为 squash 合并后的提交信息,也是 CHANGELOG 的原始素材,
# 因此按 Conventional Commits 校验。规范见 CONTRIBUTING.md。
#
# 说明:这里不用现成的 Action(如 amannn/action-semantic-pull-request),
# 而是内联一段脚本 —— 规则只有十几行,自己维护比引入一个需要固定到
# commit SHA 并长期跟踪的第三方 Action 更省事,也少一个供应链依赖。

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# 标题来自 PR 作者,属于不可信输入,因此通过环境变量传入脚本,
# 不做 ${{ }} 的字符串插值 —— 后者会造成脚本注入。

jobs:
  title:
    name: 检查 PR 标题符合 Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: 校验标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          TYPES = [
              'feat',     # 新增能力
              'fix',      # 缺陷修复
              'docs',     # 文档
              'test',     # 测试
              'refactor', # 重构,不改变外部行为
              'perf',     # 性能
              'build',    # 构建系统与依赖
              'ci',       # CI 配置
              'chore',    # 杂项(含 chore(release): x.y.z)
              'style',    # 格式,不影响语义
              'revert',   # 回滚
              'seeds',    # 内置风控资产的变更(本项目特有)
          ]

          # <type>[optional scope][!]: <description>
          PATTERN = re.compile(
              r'^(?P<type>' + '|'.join(TYPES) + r')'
              r'(?:\((?P<scope>[^()\r\n]+)\))?'
              r'(?P<breaking>!)?'
              r': (?P<desc>.+)$'
          )

          title = os.environ.get('PR_TITLE', '').strip()
          print(f'PR 标题:{title}\n')

          def fail(msg, hint=''):
              print(f'❌ {msg}')
              if hint:
                  print(hint)
              print()
              print('格式:<type>[(scope)][!]: <描述>')
              print('允许的 type:' + '、'.join(TYPES))
              print()
              print('示例:')
              print('  feat(engine): 支持 distinct_count 的精确模式')
              print('  fix(collector): 修正 syslog 驱动的时间戳解析')
              print('  docs(migration): 补充标准差语义差异说明')
              print('  seeds(strategies): 新增高频改密策略模板')
              print('  feat(domain-schema)!: 变量敏感度字段改为必填')
              print()
              print('规范说明见 CONTRIBUTING.md 与 https://www.conventionalcommits.org/')
              sys.exit(1)

          if not title:
              fail('PR 标题为空。')

          m = PATTERN.match(title)
          if not m:
              fail('PR 标题不符合 Conventional Commits 格式。',
                   '常见原因:漏了 type 前缀;冒号后缺空格;用了中文冒号「:」。')

          desc = m.group('desc').strip()
          if len(desc) < 5:
              fail('描述过短,请说明这个 PR 实际做了什么。')
          if desc.endswith(('.', '。')):
              fail('描述结尾不要加句号。')
          if len(title) > 100:
              fail(f'标题过长({len(title)} 字符),请控制在 100 字符以内,细节写进 PR 正文。')

          print(f'✅ 通过  type={m.group("type")}'
                f'  scope={m.group("scope") or "(无)"}'
                f'  breaking={"是" if m.group("breaking") else "否"}')

          if m.group('breaking'):
              print()
              print('ℹ️  标题带 `!`,表示破坏性变更。请确认:')
              print('   - CHANGELOG.md 的 [Unreleased] 中已单列 Breaking 条目')
              print('   - 条目写明了使用方需要做什么')
              print('   - 详见 docs/development/release-process.md')
          PY
