# 生产覆盖:关掉开发用的端口暴露。
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ---------------------------------------------------------------------------
# 为什么需要这个文件
#
# 基础 docker-compose.yml 把 5432 / 8123 / 9000 / 6379 / 9092 映射到宿主机 ——
# 那是**开发用**的,目的是让人能用本机工具连上去排查。照抄到生产环境等于把四个
# 数据库直接摆到网络上。
#
# 威胁模型把这一条列为「已知未缓解」,处理方写的是「部署方」。但只写在文档里
# 不够:出问题的部署几乎都是照抄了示例然后没读那段文字。所以给一份能直接用的
# 覆盖文件。
#
# 组件之间仍然互通 —— compose 的默认网络内部可达,不需要端口映射。
# ---------------------------------------------------------------------------
#
# 这份文件**没有**替你做的事:
#
#   - 控制面的 8080 仍然映射出来。它是要被访问的,但**必须**放在做 TLS 终结的
#     反向代理后面。想只让代理连上时,把下面 console-api 那段的注释打开。
#   - 采集器的接入口不在本文件里(采集器不随 compose 起)。它的认证见
#     apps/collector/README.md。
#   - syslog 入口没有认证可配,只能靠绑定内网地址加网络策略。
#
# 完整清单见 docs/security/threat-model.md 第六节。

services:
  postgres:
    # `!reset` 是取消基础文件里那份映射的**唯一**办法。
    #
    # compose 对 ports 这类列表的合并规则是**追加**:写 `ports: []` 什么也不会发生
    # (追加了零个),写别的值只会多映射一个端口 —— 两种写法都会让人以为端口关了,
    # 而实际上数据库仍然对外可达。这一条是实测确认的,不是照着文档写的。
    #
    # `!reset` 需要 Compose v2.24 以上。本机验证时用的是 v5.3.1。
    ports: !reset []

  clickhouse:
    ports: !reset []

  redis:
    ports: !reset []

  redpanda:
    ports: !reset []

  console-api:
    # 默认仍映射 8080。要求只有反向代理能连时,改成只绑回环:
    #   ports:
    #     - "127.0.0.1:8080:8080"
    # 代理与控制面不在同一台机器时,应当用网络策略而不是端口映射来限制。
    ports:
      - "8080:8080"

  jobmanager:
    # Flink Web UI。它**没有认证**,不要暴露到可信网络之外。
    ports:
      - "127.0.0.1:8081:8081"
