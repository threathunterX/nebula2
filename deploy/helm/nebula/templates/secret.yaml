{{- if not .Values.credentials.existingSecret }}
{{- /*
  没有提供 existingSecret 时生成一份。
  **口令必须显式传入** —— 不自动生成随机值:Helm 每次 upgrade 都会重新渲染模板,
  自动生成的值会在升级时变掉,而数据库里的口令不会跟着变,结果是升级之后连不上。
  这类故障只在升级时出现,首次安装完全正常,极难提前发现。
*/}}
{{- $required := list "postgresPassword" "clickhousePassword" "redisPassword" "hmacKey" }}
{{- range $required }}
  {{- if not (get $.Values.credentials .) }}
    {{- fail (printf "credentials.%s 必须显式设置(--set credentials.%s=...),或改用 credentials.existingSecret" . .) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nebula.fullname" . }}-credentials
  labels: {{- include "nebula.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ .Values.credentials.postgresUser | quote }}
  postgres-password: {{ .Values.credentials.postgresPassword | quote }}
  postgres-db: {{ .Values.credentials.postgresDb | quote }}
  clickhouse-user: {{ .Values.credentials.clickhouseUser | quote }}
  clickhouse-password: {{ .Values.credentials.clickhousePassword | quote }}
  redis-password: {{ .Values.credentials.redisPassword | quote }}
  hmac-key: {{ .Values.credentials.hmacKey | quote }}
{{- end }}
